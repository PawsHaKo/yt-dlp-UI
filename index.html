<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 轉檔</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .progress-component {
            border: 1px solid #dee2e6;
            border-radius: .25rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .progress-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">YouTube 轉檔</h1>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Bulk Download Audio from YouTube</h5>
                <form id="downloadForm">
                    <div class="mb-3">
                        <label for="youtubeUrls" class="form-label">YouTube URLs (one per line)</label>
                        <textarea class="form-control" id="youtubeUrls" rows="5" placeholder="Enter YouTube URLs, separated by newlines, commas, or spaces"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Start Processing</button>
                </form>
            </div>
        </div>

        <div id="bulk-progress" class="mt-4">
            <div class="text-center text-muted">Paste URLs and click 'Start Processing'.</div>
        </div>
        
        <div class="mt-4">
            <h2>Downloaded Files</h2>
            <ul id="fileList" class="list-group">
            </ul>
        </div>
    </div>

    <script>
        document.getElementById('downloadForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const urlsText = document.getElementById('youtubeUrls').value;
            const urls = urlsText.split(/[\s,]+/).map(url => url.trim()).filter(url => url.length > 0);
            
            document.getElementById('youtubeUrls').value = urls.join('\n');

            const bulkProgress = document.getElementById('bulk-progress');
            bulkProgress.innerHTML = ''; 

            for (let i = 0; i < urls.length; i++) {
                await simulateProcessing(urls[i], i);
            }
        });

        function simulateProcessing(url, index) {
            return new Promise(resolve => {
                const progressId = `progress-${index}`;
                const titleId = `title-${index}`;
                const progressWrapperId = `progress-wrapper-${index}`;

                const progressHtml = `
                    <div class="progress-component" id="${progressWrapperId}">
                        <div class="progress-title fw-bold" id="${titleId}">${url}</div>
                        <div class="d-flex align-items-center">
                            <div class="progress flex-grow-1 me-2" style="height: 20px;">
                                <div id="${progressId}" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('bulk-progress').innerHTML += progressHtml;

                let progress = 0;

                const interval = setInterval(() => {
                    progress += Math.random() * 5 + 1;
                    if (progress > 100) progress = 100;

                    const progressBar = document.getElementById(progressId);
                    progressBar.style.width = `${progress}%`;
                    progressBar.textContent = `${Math.round(progress)}%`;
                    progressBar.setAttribute('aria-valuenow', progress);

                    if (progress >= 100) {
                        clearInterval(interval);
                        progressBar.classList.add('progress-bar-striped', 'progress-bar-animated');
                        progressBar.textContent = 'Finalizing...';

                        fetch('/download', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url: url })
                        })
                        .then(response => response.json().then(data => ({ ok: response.ok, data })))
                        .then(({ ok, data }) => {
                            progressBar.classList.remove('progress-bar-striped', 'progress-bar-animated');
                            if (ok) {
                                progressBar.classList.add('bg-success');
                                progressBar.textContent = 'Completed';
                                document.getElementById(titleId).textContent = data.file_name;
                                updateFileList();
                            } else {
                                progressBar.classList.add('bg-danger');
                                progressBar.textContent = 'Error';
                                document.getElementById(titleId).textContent = `Error: ${data.error}`;
                            }
                            resolve();
                        })
                        .catch(error => {
                            progressBar.classList.remove('progress-bar-striped', 'progress-bar-animated');
                            progressBar.classList.add('bg-danger');
                            progressBar.textContent = 'Error';
                            document.getElementById(titleId).textContent = 'An unexpected error occurred.';
                            resolve();
                        });
                    }
                }, 200);
            });
        }

        async function updateFileList() {
            try {
                const response = await fetch('/files');
                const files = await response.json();
                const fileList = document.getElementById('fileList');
                fileList.innerHTML = '';
                files.forEach(file => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item';
                    li.innerHTML = `<a href="downloads/${file}" target="_blank">${file}</a>`;
                    fileList.appendChild(li);
                });
            } catch (error) {
                console.error('Error fetching file list:', error);
            }
        }

        // Initial file list load
        updateFileList();
    </script>
</body>
</html>
